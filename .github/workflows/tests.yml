name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install tiktoken tokenizers huggingface_hub pyyaml pytest
      - run: python -m pytest -q
      # The committed results must regenerate byte-identically from counts.json + prices.yaml.
      - run: python -m tokentax.report && git diff --exit-code results/ site/data.js
